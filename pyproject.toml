[project]
name = "libreria-parcial-Nicolas-Cuervo-Rios"
version = "0.1.0"
description = "Proyecto generado automaticamente con TDD y BDD"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: Pruebas rapidas criticas",
    "regression: Pruebas de regresion completas",
    "red: Pruebas que estan fallando o en desarrollo (ciclo RED)",
    "valido: Escenarios válidos (BDD)",
    "descuento: Relacionado a la regla de descuentos (BDD)",
    "error: Escenarios de error (BDD)",
    "precio_final: Relacionado al cálculo del precio final (BDD)"
]
